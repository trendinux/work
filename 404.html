<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Jonathan Lu</title>
<script>
/* GitHub Pages copy only: send old trendinux.github.io/work links to the live site.
   Cloudflare serves this same file as jonludesign.com's 404 page, so the hostname
   guard is what stops it redirecting to itself. */
(function(){
  if(location.hostname!=='trendinux.github.io') return;
  var KNOWN=["appt", "arvest", "dispatchtrack", "everest", "fabletics", "irc", "katin", "nester", "norton", "onehouse", "oscars", "slds-relationship-prototype", "techstars", "upclear", "vet", "vsp", "wbox"];
  var p=location.pathname.replace(/^\/work/,'');
  var m=p.match(/^\/projects\/([a-z0-9-]+)(?:\.html)?\/?$/);
  var dest='https://jonludesign.com/';
  if(m && KNOWN.indexOf(m[1])>-1) dest='https://jonludesign.com/projects/'+m[1];
  location.replace(dest);
})();
</script>
<style>
  :root{--bg:#f8f7f4;--ink:#1d1d1f;--soft:#48484a;--line:#d2d2d7;--blue:#0071e3}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:17px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px}
  main{max-width:520px}
  .code{font:12px/1 'SF Mono',ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--blue)}
  h1{font-size:40px;line-height:1.1;margin:12px 0 12px}
  p{color:var(--soft);margin:0 0 28px}
  a.btn{display:inline-block;padding:11px 18px;border-radius:10px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600}
  a.alt{margin-left:14px;color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="code">404 · PAGE NOT FOUND</div>
  <h1>That page isn&rsquo;t here.</h1>
  <p>It may have moved or been retired. The current case studies are all on the homepage.</p>
  <a class="btn" href="https://jonludesign.com/#work">View the work →</a>
  <a class="alt" href="mailto:betayards@gmail.com">Email me</a>
</main>
</body>
</html>
